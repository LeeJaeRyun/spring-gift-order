<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
</head>
<body>
<h2>로그인</h2>
<button id="kakaoLoginBtn" style="border:none; background:none; cursor:pointer;">
    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png" alt="카카오 로그인" />
</button>

<p id="msg" style="margin-top:10px; color: red;"></p>

<script>
    const kakaoLoginBtn = document.getElementById('kakaoLoginBtn');
    const msg = document.getElementById('msg');

    kakaoLoginBtn.addEventListener('click', async () => {
        try {
            const res = await fetch('/api/oauth/kakao/login-url');
            if (!res.ok) {
                msg.textContent = '로그인 URL을 가져오는데 실패했습니다.';
                return;
            }
            const loginUrl = await res.text();
            window.location.href = loginUrl;
        } catch (e) {
            msg.textContent = '오류가 발생했습니다.';
        }
    });
</script>
</body>
</html>
